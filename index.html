<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derives - develop. derive. delight.</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Language Toggle -->
    <div class="language-toggle">
        <button id="lang-ko" class="lang-btn active">한국어</button>
        <button id="lang-en" class="lang-btn">English</button>
    </div>

    <!-- Main Content -->
    <main class="container">
        <!-- Hero Section with Animation -->
        <section class="hero">
            <div class="animation-container">
                <div class="word-animation">
                    <span class="word develop">develop</span>
                    <span class="plus">+</span>
                    <span class="word derive">derive</span>
                    <span class="equals">=</span>
                    <span class="word derives">derives</span>
                </div>
            </div>

            <!-- Slogan -->
            <h1 class="slogan" data-i18n="slogan">develop. derive. delight.</h1>

            <!-- Description -->
            <p class="description" data-i18n="description">우리는 혁신적인 솔루션을 개발합니다</p>
        </section>

        <!-- Contact Section -->
        <section class="contact">
            <h2 data-i18n="contact">연락처</h2>
            <div class="social-links">
                <a href="#" id="discord-link" class="social-icon discord" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="#" id="twitter-link" class="social-icon twitter" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" id="email-link" class="social-icon email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
